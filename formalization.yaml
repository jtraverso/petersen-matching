# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Petersen's theorem"
  description: >-
    A Lean 4 / Mathlib formalization of Petersen's theorem: a finite 3-regular graph in which no
    edge is a bridge has a perfect matching; moreover, every edge of such a graph lies in some
    perfect matching. Both statements are derived from Tutte's theorem (in Mathlib) by counting
    the edges that leave the odd components.
  authors:
    - "Juan Pablo Traverso Gianini"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Juan Pablo Traverso Gianini"

classification:
  arxiv: ["math.CO"]
  msc2020: ["05C70"]

sources:
  - title: "Die Theorie der regulären graphs"
    authors:
      - "Julius Petersen"
    id: "doi:10.1007/BF02392606"
    type: "paper"
    location: "Acta Mathematica 15 (1891), 193–220"
    relationship: "formalizes"
    note: "Petersen's theorem (bridgeless cubic graphs have a perfect matching); the formal proof uses Tutte's theorem rather than Petersen's original argument."
    license: "unknown"
    author_endorsement: "n/a"
  - title: "The factorization of linear graphs"
    authors:
      - "W. T. Tutte"
    id: "doi:10.1112/jlms/s1-22.2.107"
    type: "paper"
    location: "Journal of the London Mathematical Society 22 (1947), 107–111"
    relationship: "background"
    note: "Tutte's 1-factor theorem, used through Mathlib's `SimpleGraph.tutte`."
    license: "unknown"
    author_endorsement: "n/a"

status:
  scope: >-
    Proved for every finite simple 3-regular graph in which no edge is a bridge: existence of a
    perfect matching, and for every edge a perfect matching containing it.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "autonomous"
      models: ["Aristotle (Harmonic)"]
      framework: "Aristotle CLI"
      tool_setup: >-
        Produced the proofs in one run from the formal statements and a proof plan; the return
        was audited (statements and headers unchanged, no added axioms) and rebuilt locally.
      cost:
        wall_time: "under one hour"
        spend_usd: "not tracked"
        hardware: "API-only"
      prompting_notes: "Formal statements and proof plan supplied."
    - method: "agent"
      models: ["Claude Opus 5.5"]
      framework: "Claude Code (Anthropic)"
      tool_setup: >-
        Statement design, proof plan, integration and review of the Aristotle return, and the
        Palomar packaging, checked with `lake build` and `#print axioms` (Lean v4.35.0-rc3,
        Mathlib c55e6e786f49471c72fbddbec5415808896aec1e).
      cost:
        wall_time: "about one hour"
        spend_usd: "subscription-based"
        hardware: "local machine"
      prompting_notes: "Natural-language instructions in Spanish, directed by the author."
  spend_usd: "subscription-based"
  notes: >-
    The result was chosen by the human author; the Lean proofs are AI-generated and mechanically
    verified (no `sorry`, axioms limited to propext, Classical.choice and Quot.sound, identical
    elaborated types for the Challenge/Solution pair).

fidelity:
  divergences: >-
    "Bridgeless" is stated as "no edge of the graph is a bridge" (Mathlib's `IsBridge` is also
    true of some non-edges, so the hypothesis is restricted to edges). The graph need not be
    connected. Cubic means Mathlib's `IsRegularOfDegree 3`.

review:
  status: "agent-reviewed"
  reviewers:
    - "Claude Opus 5.5 (AI agent in Claude Code, acting for the author)"
  notes: >-
    Agent review by Claude Opus 5.5, distinct from the mechanical verification: the agent
    compared the statements with Petersen's theorem and its standard strengthening, checked that
    the Aristotle return left every statement and header unchanged, and confirmed by
    `lake build`, `#print axioms` and a comparison of the fully elaborated Challenge and Solution
    types that the proofs use no `sorry` and only propext, Classical.choice and Quot.sound. The
    author directed the work and approved the statements. No independent human mathematical
    review has been performed. The results are classical; no mathematical novelty is claimed.

alignment:
  namespace: "PetersenMatching"
  statements:
    - source: "Petersen (1891)"
      lean: "PetersenMatching.exists_isPerfectMatching"
      module: "Challenge"
      status: "proved"
    - source: "Every edge of a bridgeless cubic graph lies in a perfect matching"
      lean: "PetersenMatching.exists_isPerfectMatching_mem"
      module: "Challenge"
      status: "proved"

acknowledgements: >-
  Mathlib and the Lean community; Harmonic's Aristotle.
